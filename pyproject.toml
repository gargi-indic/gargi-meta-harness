[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gargi-harness"
version = "0.1.0"
description = "A local orchestrator that drives coding agents through user-designed playbooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]

[project.scripts]
harness = "harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".orchestrator", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
